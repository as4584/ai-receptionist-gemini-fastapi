<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Receptionist | Live Monitor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --success: #4ade80;
            --danger: #f87171;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .calls-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .call-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            animation: slideIn 0.3s ease-out;
        }

        .call-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .caller-id {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .timestamp {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .metrics-row {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .metric {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .metric span {
            color: var(--text-primary);
            font-weight: 500;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading {
            text-align: center;
            color: var(--text-secondary);
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Live Call Monitor</h1>
            <div style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 5px;">
                Real-time latency & caller tracking
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Calls</div>
                <div class="stat-value" id="total-calls">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Latency</div>
                <div class="stat-value" id="avg-latency">-</div>
            </div>
        </div>

        <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Recent Calls</h2>
        <div id="calls-list" class="calls-list">
            <div class="loading">Connecting to stream...</div>
        </div>
    </div>

    <script>
        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        async function updateDashboard() {
            try {
                const response = await fetch('/metrics');
                const data = await response.json();

                // Update Stats
                document.getElementById('total-calls').textContent = data.total_calls;
                document.getElementById('avg-latency').textContent = Math.round(data.ai_latency.mean) + 'ms';

                // Update Calls List
                const listContainer = document.getElementById('calls-list');
                listContainer.innerHTML = ''; // Clear current list

                data.recent_calls.forEach(call => {
                    const card = document.createElement('div');
                    card.className = 'call-card';
                    card.innerHTML = `
                        <div class="call-header">
                            <div class="caller-id">${call.caller}</div>
                            <div class="timestamp">${formatTime(call.timestamp)}</div>
                        </div>
                        <div class="metrics-row">
                            <div class="metric">AI: <span>${Math.round(call.ai_latency_ms)}ms</span></div>
                            <div class="metric">Total: <span>${Math.round(call.total_latency_ms)}ms</span></div>
                            <div class="badge">${call.model}</div>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });

            } catch (error) {
                console.error('Error fetching metrics:', error);
            }
        }

        // Poll every 2 seconds
        setInterval(updateDashboard, 2000);
        updateDashboard();
    </script>
</body>
</html>
