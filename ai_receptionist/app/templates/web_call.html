<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Receptionist | Web Call</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        #startBtn {
            background: #38bdf8;
            color: #0f172a;
        }

        #stopBtn {
            background: #f87171;
            color: white;
            display: none;
        }

        .status {
            margin-top: 20px;
            color: #94a3b8;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(56, 189, 248, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(56, 189, 248, 0);
            }
        }
    </style>
</head>

<body>
    <h1>AI Receptionist Test</h1>
    <button id="startBtn">Start Call</button>
    <button id="stopBtn">End Call</button>
    <div class="status" id="status">Ready to connect</div>

    <script>
        let ws;
        let audioContext;
        let processor;
        let inputSource;
        let nextStartTime = 0;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');

        startBtn.onclick = async () => {
            try {
                status.textContent = "Connecting...";

                // 1. Setup Audio Context
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });

                // 2. Connect WebSocket
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${window.location.host}/web-stream`);

                ws.onopen = async () => {
                    status.textContent = "Connected! Speak now.";
                    startBtn.style.display = 'none';
                    stopBtn.style.display = 'block';
                    stopBtn.classList.add('pulse');

                    // 3. Start Recording
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    inputSource = audioContext.createMediaStreamSource(stream);

                    // Processor to capture audio
                    // Buffer size 4096, 1 input channel, 1 output channel
                    processor = audioContext.createScriptProcessor(4096, 1, 1);

                    inputSource.connect(processor);
                    processor.connect(audioContext.destination);

                    processor.onaudioprocess = (e) => {
                        const inputData = e.inputBuffer.getChannelData(0);
                        // Convert Float32 to Int16 PCM
                        const pcmData = floatTo16BitPCM(inputData);
                        // Base64 encode
                        const base64Data = arrayBufferToBase64(pcmData);

                        // Send
                        if (ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({
                                event: "media",
                                media: base64Data
                            }));
                        }
                    };
                };

                ws.onmessage = async (event) => {
                    const data = JSON.parse(event.data);
                    if (data.event === 'media') {
                        // Play audio
                        const pcmBase64 = data.media;
                        const pcmData = base64ToArrayBuffer(pcmBase64);
                        const floatData = int16ToFloat32(pcmData);

                        playAudio(floatData);
                    }
                };

                ws.onclose = () => stopCall();

            } catch (err) {
                console.error(err);
                status.textContent = "Error: " + err.message;
            }
        };

        stopBtn.onclick = stopCall;

        function stopCall() {
            if (ws) ws.close();
            if (inputSource) inputSource.disconnect();
            if (processor) processor.disconnect();
            if (audioContext) audioContext.close();

            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
            stopBtn.classList.remove('pulse');
            status.textContent = "Call ended";
        }

        // Helpers
        function floatTo16BitPCM(input) {
            const output = new Int16Array(input.length);
            for (let i = 0; i < input.length; i++) {
                const s = Math.max(-1, Math.min(1, input[i]));
                output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return output.buffer;
        }

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        function base64ToArrayBuffer(base64) {
            const binary_string = window.atob(base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function int16ToFloat32(buffer) {
            const int16 = new Int16Array(buffer);
            const float32 = new Float32Array(int16.length);
            for (let i = 0; i < int16.length; i++) {
                float32[i] = int16[i] / 32768.0;
            }
            return float32;
        }

        function playAudio(float32Data) {
            const buffer = audioContext.createBuffer(1, float32Data.length, 16000); // Assume 16k from server
            buffer.getChannelData(0).set(float32Data);

            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);

            // Simple queueing to play smoothly
            const currentTime = audioContext.currentTime;
            if (nextStartTime < currentTime) {
                nextStartTime = currentTime;
            }
            source.start(nextStartTime);
            nextStartTime += buffer.duration;
        }
    </script>
</body>

</html>
